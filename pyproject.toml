[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cs-annotation"
version = "1.0.0"
description = "Cultural Sensitivity Annotation Pipeline for MC-Exam Benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "openai>=1.40",
    "pydantic>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
human = [
    "argilla>=2.0",
    "pycountry>=24.6",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
]
all = ["cs-annotation[human,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
